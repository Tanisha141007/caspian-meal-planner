<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Caspian Meal Planner{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">Caspian Meal Planner</a>
    <span class="badge {{ 'live' if live_mode else 'mock' }}">
      {{ 'Claude live' if live_mode else 'Demo mode (no ANTHROPIC_API_KEY)' }}
    </span>
  </div>
  <div class="container{% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
